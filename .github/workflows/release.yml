name: Release

# Releases the version in Cargo.toml. Runs by itself when a push to master
# touches Cargo.toml (does nothing if that version is already released), or
# manually from the Actions tab.
on:
  push:
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "tag=$v" >> $env:GITHUB_OUTPUT
          gh release view $v *> $null
          if ($LASTEXITCODE -eq 0) {
            "Release $v already exists; nothing to do."
            "exists=true" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Test
        if: steps.version.outputs.exists != 'true'
        run: cargo test --release

      - name: Build
        if: steps.version.outputs.exists != 'true'
        run: cargo build --release

      - name: Create release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          Copy-Item target/release/rcap.exe "rcap-$env:TAG.exe"
          gh release create $env:TAG "rcap-$env:TAG.exe" `
            --target $env:GITHUB_SHA `
            --title "rcap $env:TAG" `
            --notes "Download ``rcap-$env:TAG.exe`` below and run it. There's nothing to install." `
            --generate-notes
