name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          Copy-Item target/release/rcap.exe "rcap-$env:VERSION.exe"
          gh release create $env:VERSION "rcap-$env:VERSION.exe" `
            --target $env:GITHUB_SHA `
            --title "rcap $env:VERSION" `
            --generate-notes
