name: Release

# Run manually from the Actions tab. Releases the version in Cargo.toml.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "tag=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          Copy-Item target/release/rcap.exe "rcap-$env:TAG.exe"
          gh release create $env:TAG "rcap-$env:TAG.exe" `
            --target $env:GITHUB_SHA `
            --title "rcap $env:TAG" `
            --notes "Download ``rcap-$env:TAG.exe`` below and run it. There's nothing to install." `
            --generate-notes
